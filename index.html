<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Temporizador · Iglesia y eventos</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0c1519;color:#eef7f3;font:17px system-ui,sans-serif}main{max-width:850px;margin:auto;padding:24px 16px}h1{font-size:21px;font-weight:600;margin:0 0 24px;color:#b6cbc2}.display{text-align:center;padding:24px 0}#name{font-size:clamp(24px,5vw,48px);margin:0 0 12px;overflow-wrap:anywhere}#clock{font-size:clamp(64px,18vw,160px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1;color:#91f5c6;letter-spacing:-.04em}#clock.warn{color:#ffd174}#clock.over{color:#ffa6a6}#status{color:#c0ceca;min-height:26px}form{background:#17252a;padding:18px;border:1px solid #35494e;border-radius:14px}label{display:block;color:#c0ceca;font-size:15px}input{width:100%;margin:7px 0 16px;background:#0c1519;color:white;border:1px solid #50696d;border-radius:8px;padding:11px;font:inherit;min-height:44px}.time-inputs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.controls{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}button{padding:12px 16px;min-height:46px;background:#253a40;color:white;border:1px solid #50696d;border-radius:9px;font:inherit;cursor:pointer}#toggle{flex:1;background:#91f5c6;color:#092319;font-weight:700}button:focus-visible,input:focus-visible{outline:3px solid #91f5c6;outline-offset:3px}#message{color:#ffd174;min-height:24px}body.full main{max-width:none;padding:3vw}body.full h1,body.full form,body.full #settings,body.full #message{display:none}body.full .display{min-height:75vh;display:flex;flex-direction:column;justify-content:center}body.full #clock{font-size:clamp(80px,23vw,300px)}body.full #name{font-size:clamp(26px,5vw,64px)}
</style></head><body><main>
<h1>Temporizador · Iglesia y eventos</h1>
<section class="display"><h2 id="name">Mi evento</h2><div id="clock" role="timer">45:00</div><p id="status" role="status">Listo para iniciar</p></section>
<div class="controls"><button id="toggle">Iniciar</button><button id="reset">Reiniciar</button><button id="fullscreen">Pantalla completa</button></div>
<form id="setup" novalidate>
<label>Nombre del evento o participación<input id="title" maxlength="100" value="Mi evento" placeholder="Prédica, culto, conferencia…"></label>
<div class="time-inputs"><label>Horas<input id="hours" type="number" min="0" max="23" step="1" value="0" inputmode="numeric"></label><label>Minutos<input id="minutes" type="number" min="0" max="59" step="1" value="45" inputmode="numeric"></label><label>Segundos<input id="seconds" type="number" min="0" max="59" step="1" value="0" inputmode="numeric"></label></div>
<button type="submit">Aplicar duración</button>
</form>
<div id="settings" class="controls"><button id="sound" aria-pressed="false">Activar y probar sonido</button></div><p id="message" role="status"></p>
</main><script>
const $=id=>document.getElementById(id);
const key="iglesia-eventos-timer-v1";
let state={title:"Mi evento",duration:2700000,left:2700000,end:0};
try {
 const saved=JSON.parse(localStorage.getItem(key));
 if(saved && typeof saved.title==="string" && saved.title.length<=100 &&
 Number.isFinite(saved.duration) && saved.duration>0 && saved.duration<=86399000 &&
 Number.isFinite(saved.left) && Number.isFinite(saved.end) && saved.end>=0) state=saved;
} catch {}
let audio=null;
let sound=false;
let previous=null;
function remaining(){return state.end?state.end-Date.now():state.left}
function save(){
 try {localStorage.setItem(key,JSON.stringify(state))}
 catch {$("message").textContent="El navegador no pudo guardar el temporizador."}
}
function beep(){
 if(!sound || audio?.state!=="running")return;
 const tone=audio.createOscillator(),gain=audio.createGain();
 tone.frequency.value=660;
 gain.gain.setValueAtTime(.16,audio.currentTime);
 gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.6);
 tone.connect(gain).connect(audio.destination);
 tone.start();tone.stop(audio.currentTime+.6);
}
function tick(){
 const ms=remaining();
 const s=ms<0?Math.floor(-ms/1000):Math.ceil(ms/1000);
 const h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=s%60;
 const pad=n=>String(n).padStart(2,"0");
 $("clock").textContent=(ms<0?"+":"")+(h?pad(h)+":":"")+pad(m)+":"+pad(sec);
 $("clock").className=ms<=0?"over":ms<=120000 && (state.end || state.left!==state.duration)?"warn":"";
 const label=ms<=0?"Tiempo cumplido":state.end?"Tiempo restante":state.left===state.duration?"Listo para iniciar":"En pausa";
 if($("status").textContent!==label)$("status").textContent=label;
 if(state.end && previous!==null && previous>0 && ms<=0)beep();
 previous=state.end?ms:null;
}
function render(){
 $("name").textContent=state.title;
 $("toggle").textContent=state.end?"Pausar":state.left===state.duration?"Iniciar":"Reanudar";
 tick();
}
$("title").value=state.title;
$("hours").value=Math.floor(state.duration/3600000);
$("minutes").value=Math.floor(state.duration%3600000/60000);
$("seconds").value=Math.floor(state.duration%60000/1000);
$("setup").onsubmit=event=>{
 event.preventDefault();
 const fields=[$("hours"),$("minutes"),$("seconds")];
 const values=fields.map(field=>field.valueAsNumber);
 const limits=[23,59,59];
 const bad=values.findIndex((value,i)=>!Number.isInteger(value)||value<0||value>limits[i]);
 const duration=(values[0]*3600+values[1]*60+values[2])*1000;
 if(bad>=0 || duration<=0){
  $("message").textContent="Ingresa horas de 0 a 23, minutos y segundos de 0 a 59. El tiempo debe ser mayor que cero.";
  fields[bad>=0?bad:1].focus();return;
 }
 const delta=duration-state.duration;
 if(state.end)state.end+=delta;
 else if(state.left===state.duration)state.left=duration;
 else state.left+=delta;
 state.title=$("title").value.trim()||"Mi evento";
 state.duration=duration;
 previous=null;
 $("message").textContent="Duración aplicada.";
 save();render();
};
$("toggle").onclick=()=>{
 if(state.end){state.left=remaining();state.end=0}
 else state.end=Date.now()+state.left;
 previous=null;save();render();
};
$("reset").onclick=()=>{
 if(!confirm("¿Volver a la duración configurada?"))return;
 state.end=0;state.left=state.duration;previous=null;save();render();
};
$("sound").onclick=async()=>{
 try {
  const Audio=window.AudioContext||window.webkitAudioContext;
  audio??=new Audio();await audio.resume();sound=!sound;
  $("sound").textContent=sound?"Desactivar sonido":"Activar y probar sonido";
  $("sound").setAttribute("aria-pressed",String(sound));
  if(sound)beep();
 }catch{$("message").textContent="Este navegador no pudo activar el sonido."}
};
$("fullscreen").onclick=async()=>{
 try {
  if(document.fullscreenElement)await document.exitFullscreen();
  else await document.documentElement.requestFullscreen();
 }catch{$("message").textContent="Usa la opción de pantalla completa de tu navegador."}
};
document.addEventListener("fullscreenchange",()=>{
 document.body.classList.toggle("full",Boolean(document.fullscreenElement));
 $("fullscreen").textContent=document.fullscreenElement?"Salir de pantalla completa":"Pantalla completa";
});
document.addEventListener("visibilitychange",tick);
render();setInterval(tick,1000);
</script></body></html>
